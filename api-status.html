<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPORTYNOVA · API Match Status</title>
<style>
:root{color-scheme:dark;--bg:#070b14;--panel:#111a2a;--line:#26344a;--muted:#91a1b9;--cyan:#20d9f5;--red:#ff4268;--green:#25d695;--yellow:#ffc857}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#13243b 0,#070b14 55%);color:#f4f8ff;font-family:Inter,system-ui,"Noto Sans Bengali",sans-serif;min-height:100vh}
.wrap{max-width:1050px;margin:auto;padding:22px 16px 50px}.brand{font-weight:900;letter-spacing:.5px;font-size:22px}.brand span{color:var(--red)}.sub{color:var(--muted);font-size:13px;margin-top:5px}.head{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.refresh{border:1px solid #2d5068;background:#102235;color:#dffaff;padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:20px 0}.stat,.toolbar,.match{background:linear-gradient(145deg,#121d30,#0d1523);border:1px solid var(--line);border-radius:16px}.stat{padding:15px}.stat small{display:block;color:var(--muted);font-size:12px}.stat b{display:block;font-size:26px;margin-top:7px}.toolbar{padding:12px;display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{background:#08111e;color:white;border:1px solid #304158;border-radius:10px;padding:11px;min-width:0;flex:1}.list{display:grid;gap:10px}.match{padding:15px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}.teams{font-weight:800;font-size:16px}.meta{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}.detail{font-size:12px;color:#c1cee0;margin-top:9px;line-height:1.55}.pill{font-size:11px;font-weight:900;letter-spacing:.3px;padding:7px 10px;border-radius:30px;white-space:nowrap;border:1px solid}.matched{color:var(--green);background:#0d3029;border-color:#1b745b}.notfound{color:var(--yellow);background:#382b12;border-color:#82601c}.ambiguous{color:#ff8fa6;background:#3b1724;border-color:#87314b}.empty,.error{padding:24px;text-align:center;color:var(--muted);border:1px dashed #33445b;border-radius:14px}.foot{color:#71839d;font-size:11px;text-align:center;margin-top:22px}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.match{grid-template-columns:1fr}.pill{justify-self:start}.wrap{padding:18px 12px 35px}}
</style></head>
<body><main class="wrap">
<header class="head"><div><div class="brand">SPORTY<span>NOVA</span> <small style="font-size:12px;color:#9fb2ca">1.0</small></div><div class="sub">API Match Verification Dashboard · আলাদা স্ট্যাটাস প্যানেল</div></div><button class="refresh" onclick="loadData()">↻ Refresh Status</button></header>
<section class="stats"><div class="stat"><small>Total Matches</small><b id="total">—</b></div><div class="stat"><small>API MATCHED</small><b id="matched" style="color:var(--green)">—</b></div><div class="stat"><small>NOT FOUND</small><b id="notfound" style="color:var(--yellow)">—</b></div><div class="stat"><small>AMBIGUOUS</small><b id="ambiguous" style="color:#ff8fa6">—</b></div></section>
<section class="toolbar"><input id="search" placeholder="দলের নাম / টুর্নামেন্ট দিয়ে খুঁজুন…" oninput="render()"><select id="filter" onchange="render()"><option value="ALL">সব স্ট্যাটাস</option><option>API MATCHED</option><option>NOT FOUND</option><option>AMBIGUOUS</option></select></section>
<div id="updated" class="sub" style="margin:0 2px 12px">Status data loading…</div><section id="list" class="list"><div class="empty">স্ট্যাটাস লোড হচ্ছে…</div></section>
<div class="foot">SPORTYNOVA Auto Match Time · সময় Asia/Dhaka · End Time আনুমানিক</div>
</main>
<script>
let data={matches:[]};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function badgeClass(s){return s==='API MATCHED'?'matched':s==='AMBIGUOUS'?'ambiguous':'notfound'}
function fmt(v){if(!v)return '—';try{return new Date(v).toLocaleString('en-GB',{timeZone:'Asia/Dhaka',dateStyle:'medium',timeStyle:'short'})+' (BD)'}catch{return v}}
async function loadData(){const box=document.getElementById('list');box.innerHTML='<div class="empty">স্ট্যাটাস লোড হচ্ছে…</div>';try{const r=await fetch('./api-match-status.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);data=await r.json();document.getElementById('total').textContent=data.total??(data.matches||[]).length;document.getElementById('matched').textContent=data.matched??0;document.getElementById('notfound').textContent=data.notFound??0;document.getElementById('ambiguous').textContent=data.ambiguous??0;document.getElementById('updated').textContent='সর্বশেষ চেক: '+fmt(data.generatedAt)+' · '+(data.repository||'');render()}catch(e){box.innerHTML='<div class="error">স্ট্যাটাস ডেটা পাওয়া যায়নি। GitHub Actions একবার চালান এবং GitHub Pages-এ api-match-status.json প্রকাশিত হয়েছে কি না দেখুন।<br><br>'+esc(e.message)+'</div>'}}
function render(){const q=document.getElementById('search').value.toLowerCase().trim(),f=document.getElementById('filter').value;const rows=(data.matches||[]).filter(x=>(f==='ALL'||x.status===f)&&[x.name,x.team1,x.team2,x.tournament,x.file].join(' ').toLowerCase().includes(q));const box=document.getElementById('list');if(!rows.length){box.innerHTML='<div class="empty">এই ফিল্টারে কোনো ম্যাচ পাওয়া যায়নি।</div>';return}box.innerHTML=rows.map(x=>`<article class="match"><div><div class="teams">${esc(x.team1||x.name)}${x.team1&&x.team2?' vs '+esc(x.team2):''}</div><div class="meta">${esc(x.sport||'Sport')} · ${esc(x.tournament||'Tournament not specified')}<br>JSON: ${esc(x.file||'—')}</div><div class="detail">${esc(x.message||'')}<br>API Event: ${esc(x.matchedEvent||'—')}<br>Start: ${esc(fmt(x.startTime))}<br>Estimated End: ${esc(fmt(x.endTime))}</div></div><span class="pill ${badgeClass(x.status)}">${esc(x.status)}</span></article>`).join('')}
loadData();
</script></body></html>
