name: Auto Update Match 1 Servers

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: auto-update-match-1
  cancel-in-progress: false

jobs:
  update-match-1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Python updater
        run: python -m py_compile scripts/update-match-1.py

      - name: Update matching servers in match-1.json
        run: python scripts/update-match-1.py

      - name: Commit JSON only when changed
        run: |
          if git diff --quiet -- data/matches/match-1.json; then
            echo "No JSON changes: matching streams are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches/match-1.json
          git commit -m "Auto-update match 1 servers"
          git push
