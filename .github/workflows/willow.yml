
      - name: Convert source JSON to Willow format
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          url = "https://raw.githubusercontent.com/srhady/willow-event/main/live_sports.json"

          req = urllib.request.Request(
              url, headers={"User-Agent": "Nova-Tv-Updater"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              source = json.load(response)

          # Find matches in the source JSON
          if isinstance(source, list):
              events = source
          elif isinstance(source, dict):
              events = None
              for key in ("matches", "Matches", "events", "live_sports"):
                  if isinstance(source.get(key), list):
                      events = source[key]
                      break
              if events is None and isinstance(source.get("data"), list):
                  events = source["data"]
              if events is None:
                  events = [source]
          else:
              raise ValueError("Unknown source JSON structure")

          output = []
          for i, event in enumerate(events, start=1):
              if not isinstance(event, dict):
                  continue

              name = event.get("name") or event.get("title")
              if not name:
                  continue

              match = {
                  "name": name,
                  "category": event.get("category", "Live Sports"),
                  "logo": event.get("logo", "⚽"),
                  "logoUrl": (
                      event.get("logoUrl")
                      or event.get("logo_url")
                      or event.get("cover_image")
                      or ""
                  ),
                  "fallbackLogo": "⚽",
                  "tone": event.get("tone", "gold"),
                  "section": "liveSports",
                  "show": event.get("show", "yes"),
                  "id": event.get("id", i),
                  "enabled": event.get("enabled", True),
                  "status": event.get("status", "auto"),
                  "matchType": event.get("matchType", "Football")
              }
              output.append({"match": match})

          if not output:
              raise ValueError("No matches found in source JSON")

          Path("data").mkdir(exist_ok=True)
          Path("data/willow.json").write_text(
              json.dumps(output[0] if len(output) == 1 else output,
                         ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(f"Converted {len(output)} match(es)")
          PY
