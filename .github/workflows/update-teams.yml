name: Auto-update team logos

on:
  push:
    paths:
      - "logo/**"
      - "data/team-registry.json"
      - "scripts/update_teams.py"
      - ".github/workflows/update-teams.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-team-logos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update teams.json from registered logo files
        run: python scripts/update_teams.py

      - name: Commit generated teams.json
        run: |
          if git diff --quiet -- data/teams.json; then
            echo "data/teams.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/teams.json
          git commit -m "Auto-update team logos"
          git push
