name: Build SPORTYNOVA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'www/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Fix Android Manifest namespace and screen rotation
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ANDROID_URI = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ANDROID_URI)

          path = "android/app/src/main/AndroidManifest.xml"
          tree = ET.parse(path)
          root = tree.getroot()

          ns = "{" + ANDROID_URI + "}"
          app = root.find("application")

          if app is None:
              raise SystemExit("ERROR: Android application element not found")

          main = None
          for activity in app.iter("activity"):
              for intent in activity.findall("intent-filter"):
                  actions = [
                      item.get(ns + "name")
                      for item in intent.findall("action")
                  ]
                  categories = [
                      item.get(ns + "name")
                      for item in intent.findall("category")
                  ]

                  if (
                      "android.intent.action.MAIN" in actions
                      and "android.intent.category.LAUNCHER" in categories
                  ):
                      main = activity
                      break
              if main is not None:
                  break

          if main is None:
              raise SystemExit("ERROR: Main launcher activity not found")

          main.set(ns + "screenOrientation", "fullSensor")

          tree.write(path, encoding="utf-8", xml_declaration=True)
          ET.parse(path)

          print("SUCCESS: Android namespace preserved.")
          print("SUCCESS: Screen rotation enabled.")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPORTYNOVA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
