<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06060c">
<title>RS Live TV Player</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
.player{position:relative;width:100%;height:100%;min-height:180px;background:#000;overflow:hidden}
#playerFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#loader{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;background:#000;transition:opacity .25s;pointer-events:none}
.spinner{width:42px;height:42px;border:4px solid #292936;border-top-color:#00eaff;border-right-color:#ff286d;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#loadText{font-size:13px;color:#ddd}#toolbar{position:absolute;z-index:8;left:8px;right:8px;bottom:8px;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;padding:8px;background:rgba(8,10,20,.88);border:1px solid #272b3b;border-radius:12px;backdrop-filter:blur(8px);transition:opacity .25s}
button,select{color:#fff;background:#171b2a;border:1px solid #343b50;border-radius:8px;padding:9px 11px;font-size:12px;font-weight:700;min-height:36px;cursor:pointer}button:active{background:#075b70}button.active{background:#063f4c;border-color:#00eaff;color:#00eaff}#quality{max-width:125px}
#status{position:absolute;z-index:7;top:9px;left:9px;padding:6px 9px;background:rgba(0,0,0,.72);border-radius:6px;color:#b7f8ff;font-size:11px;pointer-events:none}#retry{display:none;position:absolute;z-index:9;top:50%;left:50%;transform:translate(-50%,-50%);background:#d71950;border:0}
.player.fit #playerFrame{width:100%;height:100%;object-fit:contain}.player.fill #playerFrame{width:100%;height:100%;object-fit:fill}.player.fullscreen{width:100%;height:100%}
@media(max-width:400px){#toolbar{gap:5px;padding:6px}button,select{padding:8px;font-size:11px}}
</style>
</head>
<body>
<div class="player fit" id="player">
 <iframe id="playerFrame" title="RS Live TV Video Player" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
 <div id="loader"><div class="spinner"></div><div id="loadText">ভিডিও প্লেয়ার লোড হচ্ছে...</div></div>
 <div id="status">RS LIVE TV · PLAYER</div>
 <button id="retry" type="button">আবার চেষ্টা করুন</button>
 <div id="toolbar"><button id="fitBtn" class="active" type="button">Fit Screen</button><button id="fillBtn" type="button">Fill Screen</button><select id="quality" aria-label="Video quality"><option value="auto">Quality: Auto</option></select><button id="fullBtn" type="button">⛶ Fullscreen</button></div>
</div>
<script>
(function(){"use strict";
 const player=document.getElementById("player"),frame=document.getElementById("playerFrame"),loader=document.getElementById("loader"),loadText=document.getElementById("loadText"),retry=document.getElementById("retry"),quality=document.getElementById("quality"),status=document.getElementById("status");
 const PLAYER_PREFIX="https://rs-player.netlify.app/jw-player?url=";let streamUrl="",loadTimer=null,loading=false;
 function showLoading(message){loading=true;loader.style.display="flex";loader.style.opacity="1";loadText.textContent=message;retry.style.display="none";status.textContent="লোড হচ্ছে..."}
 function hideLoading(){loading=false;loader.style.opacity="0";status.textContent="RS LIVE TV · PLAYER";setTimeout(function(){if(!loading)loader.style.display="none"},300)}
 function showError(){loading=false;loader.style.display="flex";loader.style.opacity="1";loadText.textContent="প্লেয়ার লোড হতে সমস্যা হচ্ছে।";retry.style.display="block";status.textContent="PLAYER ERROR"}
 function loadStream(){clearTimeout(loadTimer);const params=new URLSearchParams(location.search),requestedUrl=params.get("url");if(!requestedUrl){showError();loadText.textContent="ভিডিও লিংক পাওয়া যায়নি।";retry.style.display="none";return}streamUrl=requestedUrl;let target=streamUrl;if(target.indexOf(PLAYER_PREFIX)!==0)target=PLAYER_PREFIX+encodeURIComponent(target);showLoading("ভিডিও প্লেয়ার লোড হচ্ছে...");frame.onload=function(){clearTimeout(loadTimer);hideLoading()};frame.onerror=function(){clearTimeout(loadTimer);showError()};frame.src=target;loadTimer=setTimeout(function(){if(loading)showError()},20000)}
 document.getElementById("fitBtn").addEventListener("click",function(){player.classList.remove("fill");player.classList.add("fit");this.classList.add("active");document.getElementById("fillBtn").classList.remove("active")});
 document.getElementById("fillBtn").addEventListener("click",function(){player.classList.remove("fit");player.classList.add("fill");this.classList.add("active");document.getElementById("fitBtn").classList.remove("active")});
 document.getElementById("fullBtn").addEventListener("click",async function(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(player.requestFullscreen)await player.requestFullscreen();else status.textContent="এই ব্রাউজারে Fullscreen সমর্থিত নয়"}catch(e){status.textContent="Fullscreen চালু করা যায়নি"}});
 retry.addEventListener("click",loadStream);quality.addEventListener("change",function(){status.textContent="Quality পরিবর্তন করতে ভিডিও প্লেয়ারের নিজস্ব Quality মেনু ব্যবহার করুন।";this.value="auto"});
 let hideTimer;player.addEventListener("mousemove",function(){document.getElementById("toolbar").style.opacity="1";clearTimeout(hideTimer)});loadStream();
})();
</script>
</body>
</html>
