name: Auto Update Match 7

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: auto-update-match-7
  cancel-in-progress: false

jobs:
  update-match-7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update matching servers in match-7.json
        run: python scripts/update-match-7.py

      - name: Commit JSON only when changed
        run: |
          if git diff --quiet -- data/matches/match-7.json; then
            echo "No JSON changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches/match-7.json
          git commit -m "Auto-update match 7 servers"
          git push
