name: Build SPORTYNOVA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'www/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Enable Android screen rotation
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"
          tree = ET.parse(path)
          root = tree.getroot()

          ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")

          if app is None:
              raise SystemExit("Android application element not found")

          activities = app.findall("activity")
          main = None

          for activity in activities:
              intent = activity.find("intent-filter")
              if intent is None:
                  continue

              actions = [
                  x.get(ns + "name")
                  for x in intent.findall("action")
              ]
              categories = [
                  x.get(ns + "name")
                  for x in intent.findall("category")
              ]

              if (
                  "android.intent.action.MAIN" in actions
                  and "android.intent.category.LAUNCHER" in categories
              ):
                  main = activity
                  break

          if main is None:
              raise SystemExit("Main Android activity not found")

          main.set(ns + "screenOrientation", "fullSensor")

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("Screen rotation enabled.")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPORTYNOVA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
