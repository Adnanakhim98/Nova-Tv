name: Auto Update Match 1-10 Servers

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: auto-update-match-servers
  cancel-in-progress: false

jobs:
  update-match-servers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update matching servers in match-1.json to match-10.json
        run: python scripts/update-match-servers.py

      - name: Commit changed match JSON files
        run: |
          if git diff --quiet -- data/matches/match-{1..10}.json; then
            echo "No match JSON changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches/match-{1..10}.json
          git commit -m "Auto-update match 1-10 servers"
          git push
