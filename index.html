.serverchoices{display:grid;gap:9px}.serverchoice{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:1px solid #2d3a52;background:linear-gradient(120deg,#182438,#101725);color:#f4f7ff;padding:13px;border-radius:11px;text-align:left;cursor:pointer}.serverchoice:disabled{opacity:.48;cursor:not-allowed}.serverchoice strong{font-size:12px}.serverchoice span{font-size:10px;color:#8d9bb1}.serverchoice.ready{border-color:#18a9c5}
@media(max-width:600px){.channelrow{grid-template-columns:repeat(3,minmax(0,1fr))}.category-tabs{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.category-tab{font-size:9px;padding:8px 2px}.topbar{padding:9px}.brandicon{width:33px;height:33px;flex-basis:33px}.tagline{font-size:8px}.search{width:100%;max-width:none}.contacttext{font-size:8px;max-width:76px}.contactlink{font-size:9px;padding:6px 7px}}
</style></head><body><div class="wrap">
<header class="topbar"><div class="brand"><div class="brandicon">▶</div><div><div class="brandname"><span>SPORTY</span><span class="nova">NOVA</span><span class="version">1.0</span></div><div class="tagline">WATCH LIVE · ANYTIME · ANYWHERE</div></div></div><input id="search" class="search" placeholder="Search channels…" aria-label="Search channel"></header>
<div class="sectionhead"><h2>📡 Live Channels</h2><div class="contactbox"><span class="contacttext">চ্যানেল অ্যাড করতে যোগাযোগ করুন</span><a class="contactlink telegram" href="https://t.me/SportyNovam3u8" target="_blank" rel="noopener noreferrer">Telegram</a><a class="contactlink whatsapp" href="https://chat.whatsapp.com/IP3ZfYTOGhx03cdJf2K7OK?s=sh&p=a&mlu=4&ilr=4" target="_blank" rel="noopener noreferrer">WhatsApp</a></div></div>
<main class="channelarea" id="channelArea"><div class="sectionhead"><h2>⚽ Live Sports</h2><span class="section-count" id="liveSportsCount">0 CHANNELS</span></div><div class="channelrow sportsrow" id="liveSportsChannels"></div><div class="sectionhead"><h2>📺 Live TV Channels</h2><span class="section-count" id="channelCount">0 CHANNELS</span></div><div class="category-tabs" id="categoryTabs" role="tablist" aria-label="Channel categories"></div><div id="categorySections"></div><div class="footer">© 2026 SPORTYNOVA 1.0</div></main></div>
<div class="modal" id="serverModal"><div class="modalbox"><div class="modalhead"><h3 id="serverModalTitle">Server নির্বাচন</h3><button class="xbtn" data-close>✕</button></div><div class="serverchoices" id="serverChoices"></div></div></div>
<div class="modal" id="urlModal"><div class="modalbox"><div class="modalhead"><h3>Stream URL চালান</h3><button class="xbtn" data-close>✕</button></div><label class="fieldlabel" for="streamName">চ্যানেলের নাম</label><input class="field" id="streamName" placeholder="My Live Channel"><label class="fieldlabel" for="streamUrl">Stream URL</label><input class="field" id="streamUrl" placeholder="https://example.com/live/manifest.mpd|drmScheme=clearkey&drmLicense=KID:KEY"><div class="hint">শুধু .m3u8 অথবা .mpd লিংক দিন। প্লেয়ার আলাদা পেজে খুলবে।</div><div class="modalbuttons"><button class="btn" data-close>বাতিল</button><button class="btn primary" id="playCustom">খুলুন</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
const defaults={liveSports:[{name:"Sports 1",category:"SPORTS",logo:"⚽",tone:"blue",url:""},{name:"Cricket Live",category:"CRICKET",logo:"🏏",tone:"gold",url:""},{name:"Football Live",category:"FOOTBALL",logo:"⚽",tone:"blue",url:""}],liveTvChannels:[]};
let channels=[],liveSports=[],selectedCategory="Bangla";
function safeText(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function isChannelShown(ch){const v=String(ch.Show??ch.show??"Y").trim().toLowerCase();return !["n","no","false","0","hide","hidden"].includes(v)}
function isServerShown(s){const v=String(s?.Show??s?.show??"Y").trim().toLowerCase();return !["n","no","false","0","hide","hidden"].includes(v)}
function categoryFor(ch){const raw=String(ch.category||"").toLowerCase(),name=String(ch.name||"").toLowerCase();if(ch.section==="liveSports")return "Live Sports";const e=String(ch.category||"").trim().toLowerCase();if(["movie","movies"].includes(e))return "Movie";if(["cartoon","cartoons","animation"].includes(e))return "Cartoon";if(["religion","religious","islamic","religious tv"].includes(e))return "Religion";if(["documentary","documentaries","documentary tv"].includes(e))return "Documentary";if(/movie|cinema|film/.test(name+" "+raw))return "Movie";if(/cartoon|animation|kids|children/.test(name+" "+raw))return "Cartoon";if(/religion|religious|islamic|quran|koran|azan|makkah|madinah/.test(name+" "+raw))return "Religion";if(/documentary|documentaries|discovery|nat geo|national geographic|animal planet|history tv/.test(name+" "+raw))return "Documentary";if(/sport|football|soccer|cricket|mpd|dash/.test(raw)||/\b(gtv|sony ten|star sports)\b/.test(name))return "Sports";if(/music/.test(raw+" "+name)||/9xm|b4u music|zoom/.test(name))return "Music";if(/news/.test(raw)||/news|dbc|ekhon tv/.test(name))return "News";if(/zee|jalsha|sony|colors|star |sun tv|indian/.test(name)||/indian/.test(raw))return "Indian";if(/bangla/.test(raw)||/boishakhi|asian tv|deepto|nagorik|ntv|rtv|channel i|atn bangla|bijoy|desh tv|me tv|my tv|nrb tv|rajdhani|srk tv|mohona|green tv|maasranga|bangla vision|channel 16|channel 52|amar bangla/.test(name))return "Bangla";return "Entertainment"}
const categoryInfo={Bangla:{title:"🇧🇩 Bangla TV",order:1},Indian:{title:"🇮🇳 Indian TV",order:2},Music:{title:"🎵 Music",order:3},Sports:{title:"⚽ Sports",order:4},News:{title:"📰 News",order:5},Entertainment:{title:"🎬 Entertainment",order:6},Movie:{title:"🎥 Movie",order:7},Cartoon:{title:"🧸 Cartoon",order:8},Religion:{title:"🕌 Religion",order:9},Documentary:{title:"🎞️ Documentary",order:10}};
function routePlayer(rawUrl,name="Live TV"){const raw=String(rawUrl||"").trim();if(!/^https?:\/\//i.test(raw)){alert("সঠিক http:// অথবা https:// stream URL দিন।");return}const manifest=raw.split("|")[0].split(/[?#]/)[0].toLowerCase();let page;if(manifest.endsWith(".mpd"))page="./dash-player.html";else if(manifest.endsWith(".m3u8")||manifest.endsWith(".m3u"))page="./hls-player.html";else{alert("এই পেজে শুধু .m3u8 এবং .mpd লিংক সাপোর্ট করে।");return}location.href=page+"?url="+encodeURIComponent(raw)+"&name="+encodeURIComponent(name)}
function makeChannelCard(ch,root,label,isLiveEvent=false){const b=document.createElement("button");b.type="button";b.className="channel";const logoBox=document.createElement("div");logoBox.className="chlogo "+String(ch.tone||"blue").replace(/[^a-z0-9_-]/gi,"");const logoValue=String(ch.logoUrl||ch.logo||"▶").trim();if(/^https?:\/\//i.test(logoValue)){const img=document.createElement("img");img.src=logoValue;img.alt=String(ch.name||"Channel")+" logo";img.loading="lazy";img.referrerPolicy="no-referrer";img.onerror=()=>{logoBox.innerHTML="";const f=document.createElement("span");f.className="logo-fallback";f.textContent=String(ch.fallbackLogo||"📺");logoBox.appendChild(f)};logoBox.appendChild(img)}else logoBox.textContent=logoValue;const name=document.createElement("div");name.className="chname";name.textContent=String(ch.name||"Unnamed channel");if(isLiveEvent){const badgeRow=document.createElement("div");badgeRow.className="sports-badge-row";const now=Date.now(),start=Date.parse(ch.startTime||""),end=Date.parse(ch.endTime||"");const state=(Number.isFinite(start)&&Number.isFinite(end)&&now>=end)?"ENDED":(Number.isFinite(start)&&now>=start?"LIVE":"UPCOMING");const status=document.createElement("span");status.className="chcat";status.textContent=state;badgeRow.appendChild(status);const type=document.createElement("span");type.className="chcat";type.textContent=String(ch.matchType||ch.match_type||"SPORTS").toUpperCase();badgeRow.appendChild(type);b.append(logoBox,badgeRow,name)}else{const category=document.createElement("div");category.className="chcat";category.textContent=label;b.append(logoBox,name,category)}b.addEventListener("click",()=>{if(isLiveEvent){const streams=Array.isArray(ch.streams)?ch.streams:[];const ready=streams.filter(s=>s&&String(s.url||"").trim()&&isServerShown(s));if(ready.length){if(ready.length===1)routePlayer(ready[0].url,ch.name);else openServerModal(ch,ready)}else if(ch.url)routePlayer(ch.url,ch.name);else openServerModal(ch,streams)}else if(ch.url)routePlayer(ch.url,ch.name);else alert("এই চ্যানেলের URL যোগ করা হয়নি।")});root.appendChild(b)}
function openServerModal(ch,streams){const modal=$("serverModal"),root=$("serverChoices");$("serverModalTitle").textContent=(ch.name||"Live Sports")+" — Server নির্বাচন";root.innerHTML="";streams=(streams||[]).filter(isServerShown);if(!streams.length){root.innerHTML='<div class="hint">কোনো সার্ভার URL পাওয়া যায়নি।</div>'}streams.forEach((s,i)=>{const url=String(s.url||"").trim(),b=document.createElement("button");b.type="button";b.className="serverchoice"+(url?" ready":"");b.disabled=!url;const left=document.createElement("strong");left.textContent=String(s.name||("Server "+(i+1)));const right=document.createElement("span");right.textContent=url?"▶ PLAY":"লিংক যোগ করা হয়নি";b.append(left,right);b.addEventListener("click",()=>{if(url)routePlayer(url,ch.name)});root.appendChild(b)});modal.classList.add("open")}
function render(list=channels){const tabs=$("categoryTabs"),root=$("categorySections"),sportsRoot=$("liveSportsChannels");tabs.innerHTML="";root.innerHTML="";sportsRoot.innerHTML="";const query=$("search").value.trim().toLowerCase();const now=Date.now();const liveEvents=liveSports.filter(ch=>{const end=Date.parse(ch.endTime||"");return !(Number.isFinite(end)&&now>=end)&&(!query||(String(ch.name||"")+" "+String(ch.category||"")).toLowerCase().includes(query))});liveEvents.forEach(ch=>makeChannelCard(ch,sportsRoot,"Live Sports",true));$("liveSportsCount").textContent=liveEvents.length+" CHANNELS";const filtered=list.filter(ch=>!query||(String(ch.name||"")+" "+String(ch.category||"")).toLowerCase().includes(query));const counts={};filtered.forEach(ch=>{const cat=categoryFor(ch);counts[cat]=(counts[cat]||0)+1});Object.keys(categoryInfo).sort((a,b)=>categoryInfo[a].order-categoryInfo[b].order).forEach(cat=>{const tab=document.createElement("button");tab.type="button";tab.className="category-tab"+(selectedCategory===cat?" active":"");tab.setAttribute("role","tab");tab.setAttribute("aria-selected",selectedCategory===cat?"true":"false");tab.textContent=categoryInfo[cat].title+(counts[cat]!==undefined?" · "+counts[cat]:"");tab.addEventListener("click",()=>{selectedCategory=cat;render(channels)});tabs.appendChild(tab)});$("channelCount").textContent=filtered.length+" CHANNELS";const searching=!!query;const items=searching?filtered:filtered.filter(ch=>categoryFor(ch)===selectedCategory);const head=document.createElement("div");head.className="sectionhead";const h=document.createElement("h2");h.textContent=searching?"🔎 Search Results":categoryInfo[selectedCategory].title;const count=document.createElement("span");count.className="section-count";count.textContent=items.length+" CHANNELS";head.append(h,count);root.appendChild(head);const row=document.createElement("div");row.className="channelrow"+(!searching&&selectedCategory==="Sports"?" sportsrow":"");if(!items.length){const empty=document.createElement("div");empty.className="hint";empty.textContent=searching?"এই নামে কোনো চ্যানেল পাওয়া যায়নি।":"এই ক্যাটাগরিতে কোনো চ্যানেল পাওয়া যায়নি।";root.appendChild(empty)}items.forEach(ch=>makeChannelCard(ch,row,searching?categoryFor(ch):categoryInfo[selectedCategory].title.replace(/^[^ ]+\s/,""),false));if(items.length)root.appendChild(row)}
async function loadConfig(){const files={Bangla:"./data/bangla.json",Indian:"./data/india.json",Sports:"./data/sports.json",News:"./data/news.json",Music:"./data/music.json",Entertainment:"./data/entertainment.json",Movie:"./data/movie.json",Cartoon:"./data/cartoon.json",Religion:"./data/religion.json",Documentary:"./data/documentary.json"};const results=await Promise.all(Object.entries(files).map(async([category,path])=>{try{const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();return(d.channels||d.liveTvChannels||[]).filter(c=>c&&c.name&&isChannelShown(c)).map(c=>({...c,section:"tv",category}))}catch(e){console.warn("Could not load "+path,e);return []}}));channels=results.flat();const matchFiles=Array.from({length:7},(_,i)=>`./data/matches/match-${i+1}.json`);const matches=await Promise.all(matchFiles.map(async path=>{try{const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw new Error();const d=await r.json();const item=d.match||(Array.isArray(d.liveSports)?d.liveSports[0]:null)||(Array.isArray(d.channels)?d.channels[0]:null);return item&&item.name&&isChannelShown(item)?{...item,section:"liveSports",category:"Live Sports"}:null}catch(e){return null}}));liveSports=matches.filter(Boolean);if(!liveSports.length){for(const path of ["./data/live-sports.json","./live-sports.json"]){try{const r=await fetch(path,{cache:"no-store"});if(!r.ok)continue;const d=await r.json();liveSports=(d.liveSports||d.channels||[]).filter(c=>c&&c.name&&isChannelShown(c)).map(c=>({...c,section:"liveSports",category:"Live Sports"}));if(liveSports.length)break}catch(e){}}}if(!channels.length){try{const r=await fetch("./channels.json",{cache:"no-store"});if(r.ok){const d=await r.json();channels=(d.liveTvChannels||[]).filter(c=>c&&c.name&&isChannelShown(c)).map(c=>({...c,section:"tv"}));if(!liveSports.length)liveSports=(d.liveSports||[]).filter(c=>c&&c.name&&isChannelShown(c)).map(c=>({...c,section:"liveSports",category:"Live Sports"}))}}catch(e){}}if(!liveSports.length)liveSports=defaults.liveSports.map(c=>({...c,section:"liveSports",category:"Live Sports"}));render()}
$("search").addEventListener("input",()=>render(channels));document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest(".modal").classList.remove("open"));$("playCustom").onclick=()=>{const url=$("streamUrl").value.trim(),name=$("streamName").value.trim()||"Custom Live";if(!url){alert("Stream URL দিন");return}routePlayer(url,name)};loadConfig();setInterval(()=>render(channels),30000);
</script></body></html>
