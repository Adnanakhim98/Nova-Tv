<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>SPORTYNOVA — Video Banner</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: #07111f; color: #fff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  .banner {
    position: relative; isolation: isolate; overflow: hidden;
    width: min(1200px, 100%); margin: 0 auto;
    min-height: clamp(210px, 34vw, 420px);
    border-radius: 22px; background: #101b2b;
    box-shadow: 0 18px 55px rgba(0,0,0,.4);
  }
  .banner video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    z-index: -2;
  }
  .banner::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(90deg, rgba(3,8,18,.88) 0%, rgba(3,8,18,.48) 48%, rgba(3,8,18,.12) 100%),
                linear-gradient(0deg, rgba(3,8,18,.35), transparent 55%);
  }
  .banner-content {
    min-height: inherit; display: flex; flex-direction: column;
    align-items: flex-start; justify-content: center;
    padding: clamp(22px, 5vw, 58px); max-width: 720px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px; border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; background: rgba(255,255,255,.1);
    font-size: 12px; font-weight: 800; letter-spacing: 1.4px;
    text-transform: uppercase; backdrop-filter: blur(8px);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff344f; box-shadow: 0 0 12px #ff344f; }
  h1 { margin: 17px 0 8px; font-size: clamp(30px, 5.4vw, 64px); line-height: .98; letter-spacing: -1.7px; }
  h1 span { color: #48e0b5; }
  p { margin: 0; color: rgba(255,255,255,.86); font-size: clamp(13px, 1.8vw, 17px); line-height: 1.55; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 23px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 42px; padding: 0 17px; border-radius: 12px;
    text-decoration: none; font-size: 14px; font-weight: 800;
    transition: transform .2s ease, opacity .2s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .primary { background: #48e0b5; color: #06131a; }
  .secondary { color: #fff; border: 1px solid rgba(255,255,255,.45); background: rgba(0,0,0,.2); backdrop-filter: blur(8px); }
  .video-toggle {
    position: absolute; right: 14px; bottom: 14px; z-index: 2;
    width: 40px; height: 40px; border: 1px solid rgba(255,255,255,.35);
    border-radius: 50%; color: #fff; background: rgba(0,0,0,.42);
    cursor: pointer; font-size: 16px; backdrop-filter: blur(8px);
  }
  .note { width: min(1200px, 100%); margin: 15px auto 0; color: #aab7c9; font-size: 13px; line-height: 1.6; }
  @media (max-width: 520px) {
    body { padding: 12px; }
    .banner { border-radius: 16px; min-height: 250px; }
    .banner::after { background: linear-gradient(90deg, rgba(3,8,18,.82), rgba(3,8,18,.25)), linear-gradient(0deg, rgba(3,8,18,.3), transparent); }
    h1 { letter-spacing: -1px; }
    .actions { margin-top: 17px; }
    .btn { min-height: 40px; padding: 0 13px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<section class="banner" aria-label="SPORTYNOVA video banner">
  <video id="bannerVideo" autoplay muted loop playsinline preload="metadata" poster="">
    <source src="banner-video.mp4" type="video/mp4">
  </video>
  <div class="banner-content">
    <div class="eyebrow"><span class="dot"></span> Live TV · Live Sports</div>
    <h1>SPORTY<span>NOVA</span></h1>
    <p>Your destination for live sports and entertainment.</p>
    <div class="actions">
      <a class="btn primary" href="#live-sports">Explore Live Sports</a>
      <a class="btn secondary" href="#live-tv">Watch Live TV</a>
    </div>
  </div>
  <button class="video-toggle" id="videoToggle" type="button" aria-label="Pause background video" title="Pause / play video">Ⅱ</button>
</section>
<p class="note">নিজের ওয়েবসাইটে বসানোর আগে বাটনের <code>#live-sports</code> ও <code>#live-tv</code> লিংক আপনার আসল সেকশন/পেজের লিংক দিয়ে বদলে নিন। ভিডিও ও HTML একই ফোল্ডারে রাখুন।</p>
<script>
  const video = document.getElementById('bannerVideo');
  const toggle = document.getElementById('videoToggle');
  toggle.addEventListener('click', () => {
    if (video.paused) {
      video.play().catch(() => {});
      toggle.textContent = 'Ⅱ';
      toggle.setAttribute('aria-label', 'Pause background video');
    } else {
      video.pause();
      toggle.textContent = '▶';
      toggle.setAttribute('aria-label', 'Play background video');
    }
  });
</script>
</body>
</html>
