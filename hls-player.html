<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>SPORTYNOVA HLS Player</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body,#player-container{width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif}
#player-container{position:fixed;inset:0}video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
#status{position:fixed;top:12px;right:12px;z-index:10;max-width:85%;padding:8px 12px;border-radius:18px;background:#202020d9;color:#fff;font-size:12px;line-height:1.4}
#retry{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:11;border:0;border-radius:24px;padding:12px 18px;background:#16c5e5;color:#001018;font-weight:700}
</style>
</head>
<body>
<div id="player-container"><video id="video" autoplay playsinline webkit-playsinline controls preload="auto"></video></div>
<div id="status">স্ট্রিম প্রস্তুত হচ্ছে…</div><button id="retry" type="button">আবার চেষ্টা করুন</button>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>
<script>
(async function(){
 const video=document.getElementById('video'),status=document.getElementById('status'),retry=document.getElementById('retry');
 const params=new URLSearchParams(location.search); const streamUrl=(params.get('url')||'').trim(); let hls=null,shakaPlayer=null;
 function say(s){status.textContent=s;status.style.display='block'}
 function clean(){if(hls){try{hls.destroy()}catch(e){}hls=null}if(shakaPlayer){try{shakaPlayer.destroy()}catch(e){}shakaPlayer=null}video.pause();video.removeAttribute('src');video.load();retry.style.display='none'}
 async function start(){
  clean();
  if(!/^https?:\/\//i.test(streamUrl)){say('স্ট্রিম URL পাওয়া যায়নি। মূল সাইট থেকে আবার চ্যানেল নির্বাচন করুন।');retry.style.display='block';return}
  say('লোড হচ্ছে…'); video.muted=false;video.volume=1;
  const path=(()=>{try{return new URL(streamUrl).pathname.toLowerCase()}catch(e){return streamUrl.toLowerCase()}})();
  try{
   if(/\.mpd$/.test(path)){
    if(!window.shaka)throw new Error('DASH player library লোড হয়নি');
    shaka.polyfill.installAll(); if(!shaka.Player.isBrowserSupported())throw new Error('এই ব্রাউজারে DASH সাপোর্ট নেই');
    shakaPlayer=new shaka.Player(); await shakaPlayer.attach(video);
    shakaPlayer.addEventListener('error',e=>say('DASH playback error ('+(e.detail&&e.detail.code||'unknown')+') — লিংক/CORS/DRM পরীক্ষা করুন'));
    await shakaPlayer.load(streamUrl);
   }else if(window.Hls&&Hls.isSupported()){
    hls=new Hls({enableWorker:true,lowLatencyMode:true,backBufferLength:30,manifestLoadingTimeOut:15000,levelLoadingTimeOut:15000});
    hls.on(Hls.Events.ERROR,(_,data)=>{if(data&&data.fatal){say('HLS error: '+data.type+' — অন্য সার্ভার চেষ্টা করুন');retry.style.display='block';}});
    hls.loadSource(streamUrl);hls.attachMedia(video);
    await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(new Error('স্ট্রিম লোড হতে সময় বেশি লাগছে')),20000);hls.once(Hls.Events.MANIFEST_PARSED,()=>{clearTimeout(timeout);resolve()});hls.once(Hls.Events.ERROR,(_,d)=>{if(d&&d.fatal){clearTimeout(timeout);reject(new Error('HLS stream error: '+d.type))}})});
   }else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=streamUrl;video.load()}
   else {throw new Error('এই ব্রাউজারে HLS চালানোর সুবিধা নেই')}
   video.muted=false;video.volume=1;try{await video.play()}catch(e){say('স্ট্রিম লোড হয়েছে — Play চাপুন');return}
   say('ভিডিও চলছে');
  }catch(e){console.error('SPORTYNOVA player:',e);say((e&&e.message)||'ভিডিও চালানো যায়নি। URL, CORS, access token বা DRM পরীক্ষা করুন।');retry.style.display='block'}
 }
 video.addEventListener('playing',()=>say('ভিডিও চলছে'));video.addEventListener('waiting',()=>say('বাফার হচ্ছে…'));video.addEventListener('error',()=>{say('ভিডিও চালানো যায়নি — অন্য সার্ভার চেষ্টা করুন');retry.style.display='block'});
 retry.addEventListener('click',start);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!video.paused) {video.muted=false;video.volume=1}});
 await start();
})();
</script>
</body></html>
