
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Video Player</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#player-container {
  position: fixed;
  inset: 0;
  background: #000;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

#status {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 10;
  color: white;
  background: #222;
  border-radius: 20px;
  padding: 8px 12px;
  font-size: 12px;
}
</style>
</head>

<body>

<div id="player-container">
  <video id="video"
    autoplay
    playsinline
    preload="metadata">
  </video>
</div>

<div id="status">Player Ready</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>

<script>
async function initPlayer() {
  const video = document.getElementById("video");
  const container = document.getElementById("player-container");
  const status = document.getElementById("status");

  try {
    shaka.polyfill.installAll();

    if (!shaka.Player.isBrowserSupported()) {
      status.textContent = "Browser Not Supported";
      return;
    }

    const player = new shaka.Player();
    await player.attach(video);

    const ui = new shaka.ui.Overlay(
      player,
      container,
      video
    );

    ui.configure({
      addBigPlayButton: true,
      controlPanelElements: [
        "play_pause",
        "mute",
        "time_and_duration",
        "spacer",
        "quality",
        "picture_in_picture",
        "fullscreen"
      ]
    });

    // নিজের অনুমোদিত ভিডিও স্ট্রিম URL এখানে দিন
    const streamUrl = "YOUR_AUTHORIZED_STREAM_URL";

    status.textContent = "Loading...";

    await player.load(streamUrl);

    status.textContent = "Ready";
    video.play().catch(() => {});

    video.addEventListener("playing", () => {
      status.textContent = "Playing";
    });

    player.addEventListener("error", (event) => {
      status.textContent =
        "Playback Error: " + event.detail.code;
    });

  } catch (error) {
    status.textContent = "Unable to Play Video";
    console.error(error);
  }
}

document.addEventListener(
  "DOMContentLoaded",
  initPlayer
);
</script>

</body>
</html>
