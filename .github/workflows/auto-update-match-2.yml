
name: Auto Update Match 2

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: auto-update-match-2
  cancel-in-progress: false

jobs:
  update-match-2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Update Match 2
        run: python scripts/update-match-2.py

      - name: Check Match 2 changes
        run: |
          git status --short
          git diff -- data/matches/match-2.json

      - name: Commit and push Match 2 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/matches/match-2.json

          if git diff --cached --quiet; then
            echo "No changes to match-2.json"
          else
            git commit -m "Auto update match 2 server"
            git push origin HEAD:main
          fi
