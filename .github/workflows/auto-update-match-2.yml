
name: Auto Update Match 2

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-match-2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update Match 2
        run: python scripts/update-match-servers.py

      - name: Commit Match 2 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches/match-2.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto update match 2 server"
            git push
          else
            echo "No changes to commit"
          fi
